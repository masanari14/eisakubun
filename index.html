<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="やり直し英作文">
<meta name="theme-color" content="#f5f7fb">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%;text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>やり直し英作文 社会人版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout: one narrow study column like a notebook page; sentence is the hero, tools pinned to the bottom edge */
:root{
  --paper:#f5f7fb; --sheet:#ffffff; --ink:#18202f; --muted:#5b6476; --line:#dde2ec;
  --accent:#2453c2; --accent-ink:#ffffff; --soft:#e9eefa;
  --marker:rgba(255,208,0,.5); --good:#1d8657; --bad:#c23a3a; --goodbg:rgba(29,134,87,.1); --badbg:rgba(194,58,58,.1);
  --f-en:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ja:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',system-ui,sans-serif;
  --f-ipa:'Noto Sans','Lucida Sans Unicode','Arial Unicode MS',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10141c; --sheet:#181d28; --ink:#e7ebf3; --muted:#9aa3b5; --line:#2a3141;
  --accent:#8aa9ff; --accent-ink:#0c1120; --soft:#1f2738;
  --marker:rgba(255,196,0,.28); --good:#52c48f; --bad:#ff8080; --goodbg:rgba(82,196,143,.14); --badbg:rgba(255,128,128,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10141c; --sheet:#181d28; --ink:#e7ebf3; --muted:#9aa3b5; --line:#2a3141;
  --accent:#8aa9ff; --accent-ink:#0c1120; --soft:#1f2738;
  --marker:rgba(255,196,0,.28); --good:#52c48f; --bad:#ff8080; --goodbg:rgba(82,196,143,.14); --badbg:rgba(255,128,128,.14); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ja);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-block:8px 48px}
.bar{display:flex;align-items:center;gap:8px;min-height:52px}
.bar h1{font-size:16px;font-weight:700;margin:0;flex:1;min-width:0;text-wrap:balance}
.icon{border:0;background:none;padding:8px 10px;border-radius:10px;font-size:15px;color:var(--muted)}
.icon:hover{background:var(--soft)}
.icon.on{color:#e0a400}
.icon.nav{color:var(--ink);font-size:14px;padding:8px 8px;white-space:nowrap}
.icon:disabled{opacity:.35;cursor:default}
.brand{padding-block:20px 8px}
.brand small{display:block;color:var(--muted);font-size:13px;letter-spacing:.04em}
.brand b{font-size:26px;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat strong{font-family:var(--f-en);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.wide{width:100%;padding:14px;font-size:16px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.section-t{font-size:13px;color:var(--muted);letter-spacing:.06em;margin:24px 0 8px}
.chap{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px}
.meter{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:16px}
/* study */
.steps{display:flex;gap:6px;margin:4px 0 18px}
.steps button{flex:1;border:0;border-radius:8px;padding:6px 0;font-family:var(--f-en);font-size:13px;background:var(--soft);color:var(--muted)}
.steps button.done{background:color-mix(in srgb,var(--accent) 25%,var(--soft));color:var(--ink)}
.steps button.now{background:var(--accent);color:var(--accent-ink);font-weight:600}
.lead{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.lead b{color:var(--ink);font-weight:700;letter-spacing:0;font-size:15px;margin-right:6px}
.en{font-family:var(--f-en);font-size:24px;line-height:1.75;margin:8px 0;word-break:normal}
.en .w{border:0;background:none;padding:0 1px;border-radius:4px;font-family:inherit;font-size:inherit;line-height:inherit;border-bottom:1px dotted transparent}
.en .w:hover{border-bottom-color:var(--muted)}
.en .w.ok{color:var(--good)}
.en .w.ng{color:var(--bad);text-decoration:underline wavy}
.pat{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 2px}
.pat-play{border:0;background:var(--accent);color:var(--accent-ink);font-size:10px;border-radius:6px;padding:2px 6px;vertical-align:middle;margin-left:2px;font-family:var(--f-ja)}
.ja{font-size:16px;color:var(--muted);margin:4px 0 18px}
.ja.big{font-size:22px;color:var(--ink);font-weight:500;margin:12px 0 24px;text-wrap:balance}
.pattern-chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);margin-bottom:10px}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;display:grid;place-items:center;margin:8px auto 6px}
.mic.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}.shake{animation:none!important}}
.center{text-align:center}
.dict-in{width:100%;min-width:0;font-family:var(--f-en);font-size:18px;line-height:1.5;border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;background:var(--sheet);color:var(--ink);resize:vertical}
.dict-in::placeholder{font-family:var(--f-ja);font-size:14px;color:var(--muted)}
.srsnote.go{color:var(--good);font-weight:700}
.feedback{text-align:center;font-weight:700;min-height:28px;margin:8px 0}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.heard{font-family:var(--f-en);color:var(--muted);text-align:center;font-size:14px}
.answer-zone{min-height:64px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:14px}
.answer-zone.good{border-color:var(--good);background:var(--goodbg)}
.answer-zone.bad{border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-en);font-size:17px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 12px;box-shadow:0 1px 0 var(--line)}
.tile.placed{background:var(--soft)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cloze{font-family:var(--f-en);font-size:21px;line-height:2.2}
.cloze input{font-family:var(--f-en);font-size:19px;width:5.2em;border:0;border-bottom:2px solid var(--accent);background:transparent;color:var(--ink);padding:0 4px;text-align:center;border-radius:0}
.cloze input.bad{border-bottom-color:var(--bad);color:var(--bad)}
.cloze input.good{border-bottom-color:var(--good);color:var(--good)}
.hintline{font-family:var(--f-en);letter-spacing:.06em;color:var(--muted);font-size:17px;margin:10px 0}
.reveal{background:var(--soft);border-radius:12px;padding:12px 14px;margin:12px 0}
.reveal .en{font-size:19px;margin:0}
.ikinari{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:18px;background:var(--sheet)}
.ikinari p{margin:0;font-size:13px;color:var(--muted)}
.result{text-align:center;padding-top:12px}
.result .badge{font-size:28px;font-weight:700;margin-bottom:6px}
.result .en{font-size:21px}
.srsnote{font-size:13px;color:var(--muted)}
.tools{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tools .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.tools a,.tools button{border:0;background:none;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--muted);text-decoration:none}
.tools a:hover,.tools button:hover{background:var(--soft)}
.helpers{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.help-btn{display:inline-flex;align-items:center;gap:6px;border-color:var(--accent);color:var(--accent);font-weight:700;text-decoration:none;font-size:15px;line-height:1.6}
.help-btn:hover{background:var(--soft)}
.skipnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.sel{font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);min-width:0;flex:1;max-width:100%}
#pop{position:absolute;z-index:35;max-width:min(300px,calc(100vw - 24px));background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#pop::after{content:"";position:absolute;left:var(--ax,50%);bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
#pop.below::after{bottom:auto;top:-6px}
#pop .pw b{font-family:var(--f-en);font-size:19px;font-weight:600}
#pop .ipa{color:inherit;opacity:.75;font-size:15px}
#pop .pm{font-size:14.5px;margin-top:2px}
.en-row{display:flex;gap:12px;align-items:flex-start}
.en-row .en{flex:1;min-width:0;margin:2px 0 8px}
.spk{flex:none;width:44px;height:44px;margin-top:4px;border-radius:50%;border:1px solid var(--accent);background:var(--sheet);color:var(--accent);display:grid;place-items:center;padding:0}
.spk:hover{background:var(--soft)}
/* list */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 10px}
.tabs button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.item .no{font-family:var(--f-en);color:var(--muted);font-size:13px;padding-top:2px;font-variant-numeric:tabular-nums}
.item .tx{min-width:0}
.item .e{font-family:var(--f-en);font-size:15px}
.item .j{font-size:12.5px;color:var(--muted)}
.item.off .e,.item.off .j{opacity:.45}
.dots{display:flex;gap:3px;margin-top:6px}
.dots i{width:14px;height:4px;border-radius:2px;background:var(--soft)}
.dots i.f{background:var(--accent)}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--badbg);color:var(--bad)}
.item .acts{display:flex;align-items:center;gap:2px}
.sw{position:relative;width:40px;height:24px;border-radius:12px;border:0;background:var(--line);padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--sheet);transition:left .15s}
.sw.on{background:var(--accent)} .sw.on::after{left:19px}
.practice{border:1px solid var(--line);background:var(--sheet);border-radius:8px;font-size:12px;padding:4px 8px}
/* settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set p{margin:0} .set small{display:block;color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 10px;font-family:var(--f-en);font-size:13px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
/* sheet & toast */
#sheet{position:fixed;inset:0;z-index:30}
.sheet-back{position:absolute;inset:0;background:rgba(10,14,22,.45)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--sheet);border-radius:18px 18px 0 0;
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet-body .in{max-width:560px;margin:0 auto;position:relative}
.sheet-x{position:absolute;right:-6px;top:-10px;border:0;background:none;font-size:24px;color:var(--muted);padding:4px 10px}
.wd{font-family:var(--f-en);font-size:28px;font-weight:600}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:17px;margin-left:8px}
.sheet-body h3{font-size:13px;color:var(--muted);letter-spacing:.06em;margin:18px 0 6px;font-weight:500}
.kv{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.kv b{font-family:var(--f-en);font-weight:500;min-width:7em}
.say{border:0;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:12px}
.menu-item{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);
  border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
#toast button{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
:root[data-theme="dark"] #toast button{color:var(--accent-ink)}
.mine-form label{display:block;font-weight:700;margin:14px 0 6px}
.mine-form textarea,.mine-form input{width:100%;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
.mine-form textarea,#my-span{font-family:var(--f-en)}
.practice.danger{color:var(--bad);border-color:var(--bad);font-weight:700}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn{cursor:pointer;display:inline-block}
.bk-area{width:100%;min-width:0;font-family:ui-monospace,Menlo,monospace;font-size:13px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink)}
/* larger, phone-friendly type */
body{font-size:16px}
.lead{font-size:14.5px}.lead b{font-size:17px}
.srsnote,.count{font-size:14.5px}
.note{font-size:15px}
.stat span{font-size:13.5px}.stat em{font-size:13.5px}.stat strong{font-size:24px}
.btn{font-size:16px;padding:12px 18px}
.icon{font-size:16px}.icon.nav{font-size:16px;font-weight:700;color:var(--ink)}
.icon.home{color:var(--ink);padding:6px 8px;display:inline-grid;place-items:center}
.steps button{font-size:15px;padding:9px 0}
.ja{font-size:18px}.ja.big{font-size:24px}
.en{font-size:26px}
.pattern-chip{font-size:14px}
.pat-play{font-size:12px;padding:3px 7px}
.tile{font-size:19px;padding:10px 14px}
.cloze{font-size:23px}.cloze input{font-size:21px}
.heard{font-size:15.5px}.feedback{font-size:17px}
.tabs button{font-size:14.5px;padding:8px 14px}
.item .e{font-size:16.5px}.item .j{font-size:14px}.item .no{font-size:14px}
.set small{font-size:13.5px}
.practice{font-size:14px;padding:6px 10px}
.menu-item{font-size:16px}
.sheet-body .kv{font-size:16px}
#pop .pm{font-size:16px}#pop .pw b{font-size:21px}
.chaps{display:grid;gap:10px}
.chap{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.chap:hover{border-color:var(--accent)}
.chap-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chap-top b{min-width:0;font-size:16px}
.chap-n{white-space:nowrap;color:var(--muted);font-size:14.5px;font-variant-numeric:tabular-nums}
.chap .meter{display:block}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:22px 0 2px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.chap-switch{display:block;border:0;background:none;padding:2px 0 8px;color:var(--accent);font-weight:700;font-size:15px;text-align:left}
.dict-row{display:flex;gap:10px;align-items:stretch}
.dict-row .dict-in{flex:1}
.dict-btns{display:flex;flex-direction:column;gap:6px}
.dict-go{flex:1;padding:10px 18px;font-size:17px}
.dict-clear{padding:6px 10px;font-size:14px}
.dict-help{margin:8px 0 6px}
/* while the keyboard is open: keep only the prompt, the input and the judge button */
body.typing .bar,body.typing .steps,body.typing .chap-switch,body.typing .helpers,body.typing .playrow,body.typing .pattern-chip,body.typing .dict-help,body.typing .lead,body.typing .heard,body.typing .feedback:empty{display:none}
body.typing #app{padding-block:6px 8px}
body.typing .ja.big{font-size:21px;margin:4px 0 10px}
body.typing .en{font-size:21px;margin:2px 0 4px}
body.typing .ja{margin:2px 0 10px;font-size:16px}
body.typing .spk{width:36px;height:36px}
</style>

<div id="app"></div>
<div id="sheet" hidden></div>

<script>

function act(name){
  const d = cur ? byId[cur.id] : null;
  switch (name){
    case "start": startToday(); break;
    case "play": speak(d.en); break;
    case "slow": speak(d.en, true); break;
    case "pass1": passStep(); break;
    case "ikinari": stopListen(); cur.ikinari = true; cur.step = 6; st = {fails: 0}; render(); break;
    case "fromstart": cur.quick = false; cur.mode = "practice"; goStep(1); break;
    case "mic": micToggle(d); break;
    case "hint6": st.showHint = true; render(); break;
    case "show6": st.shown = true; render(); speak(d.en); break;
    case "self-ok": st.result = {pct: 100, ok: d.words.map(() => true), heard: ""}; onSpeechPass(); break;
    case "self-ng": st.shown = false; onSpeechFail(); break;
    case "selfpass": passStep(); render(); break;
    case "dictclear": st.dictText = ""; st.result = null; render(); { const el = document.getElementById("dict"); if (el) el.focus(); } break;
    case "dictcheck": {
      const txt = (st.dictText || "").trim();
      if (!txt){ toast("入力欄に英語が入っていません。キーボードの🎙で話してください"); break; }
      st.result = scoreSpeech(d, txt); st.dictText = "";
      { const el = document.getElementById("dict"); if (el) el.blur(); } document.body.classList.remove("typing");
      if (st.result.pct >= S.settings.pass) onSpeechPass(); else onSpeechFail();
      break; }
    case "speechnext": if (cur.step < 6) goStep(cur.step + 1); else finishItem(true); break;
    case "mysave": {
      const en = (document.getElementById("my-en").value || "").trim(), ja = (document.getElementById("my-ja").value || "").trim(), span = (document.getElementById("my-span").value || "").trim();
      if (!/[A-Za-z]/.test(en)){ toast("英文を入力してください"); break; }
      if (!ja){ toast("日本語訳を入力してください（ステップ3〜6の問題になります）"); break; }
      const clean_en = en.replace(/\s*\/\s*/g, " ").replace(/\s+/g, " ");
      if (span && !clean_en.replace(/[’‘]/g, "'").includes(span.replace(/[’‘]/g, "'"))) toast("覚えたい構文が英文の中に見つからないため、自動で穴埋めを作ります");
      if (editId){ const c = S.custom.find(x => x.id === editId); if (c){ if (c.en !== en){ ["prog","srs","weak"].forEach(k => delete S[k][c.id]); } c.en = en; c.ja = ja; c.span = span; } editId = null; save(); rebuildData(); render(); toast("保存しました"); }
      else { const id = Math.max(10000, ...S.custom.map(x => x.id)) + 1; S.custom.push({id, en, ja, span}); save(); rebuildData(); render(); toast("登録しました。ホームの「マイ例文」から練習できます"); }
      break; }
    case "mycancel": editId = null; render(); break;
    case "bk-save": {
      const text = JSON.stringify(backupPayload(), null, 1);
      if (window.claude && typeof window.claude.use === "function"){
        window.claude.use("downloads").then(dl => {
          if (!dl){ toast("ここではファイルに保存できません。「文字でコピー」を使ってください"); return; }
          dl.save({filename: backupName(), data: text}).then(() => toast("保存しました"), e => { if (!e || e.code !== "declined") toast("保存できませんでした。「文字でコピー」を使ってください"); });
        });
        break;
      }
      try {
        const blob = new Blob([JSON.stringify(backupPayload(), null, 1)], {type: "application/json"});
        const url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast("保存しました。iPhoneは「ファイル」アプリのダウンロードに入ります");
      } catch(e){ toast("ファイルに保存できませんでした。「文字でコピー」を使ってください"); }
      break; }
    case "bk-copy": {
      const txt = JSON.stringify(backupPayload());
      const fallback = () => { bk.showText = txt; render(); const el = document.getElementById("bk-out"); if (el){ el.focus(); el.select(); } };
      try { navigator.clipboard.writeText(txt).then(() => { bk.showText = ""; render(); toast("コピーしました。メモ帳などに貼り付けて保存してください"); }, fallback); } catch(e){ fallback(); }
      break; }
    case "bk-paste": bk.pasting = true; bk.data = null; render(); { const el = document.getElementById("bk-text"); if (el) el.focus(); } break;
    case "bk-parse": { const el = document.getElementById("bk-text"); readBackup(el ? el.value : ""); break; }
    case "tobackup": view = "settings"; render(); setTimeout(() => { const el = document.getElementById("backup"); if (el) el.scrollIntoView({block: "start"}); }, 30); break;
    case "bk-cancel": bk = {}; render(); break;
    case "bk-merge": {
      let n = 0; const have = new Set(S.custom.map(c => c.en.trim()));
      (bk.data.custom || []).forEach(c => { if (!c || !c.en || have.has(c.en.trim())) return; const id = Math.max(10000, ...S.custom.map(x => x.id)) + 1; S.custom.push({id, en: c.en, ja: c.ja || "", span: c.span || ""}); have.add(c.en.trim()); n++; });
      save(); rebuildData(); bk = {}; render(); toast(n ? `マイ例文を${n}文追加しました` : "追加する新しい文はありませんでした");
      break; }
    case "bk-restore": {
      S = Object.assign(JSON.parse(JSON.stringify(DEF)), bk.data); S.settings = Object.assign({}, DEF.settings, S.settings || {}); if (!Array.isArray(S.custom)) S.custom = [];
      save(); rebuildData(); bk = {}; pickVoice(); render(); toast("バックアップから復元しました");
      break; }
    case "selfjudge": stopListen(); st.selfMode = true; st.err = ""; render(); break;
    case "skip": S.weak[cur.id] = true; save(); if (cur.step < 6) goStep(cur.step + 1); else finishItem(false); break;
    case "fail6": S.weak[cur.id] = true; save(); finishItem(false); break;
    case "hint5": st.hint = (st.hint || 0) + 1; render(); break;
    case "check5": checkCloze(d); break;
    case "fav": S.fav[cur.id] ? delete S.fav[cur.id] : S.fav[cur.id] = true; save(); render(); break;
    case "menu": openSheet(`<h3>出題の設定</h3><button class="menu-item" data-sheet="exclude">この文を出題しない（一覧からいつでも戻せます）</button>`); break;
    case "explain": explainSheet(d); break;
    case "chapters": openSheet(`<h3>章を切り替える</h3>${chapters().map(c => { const dn = c.items.filter(x => isMastered(x.id)).length; return `<button class="menu-item" data-sheet="ch-${c.n}"><b>${chName(c.n)}</b><span style="float:right;color:var(--muted)">${dn}/${c.items.length}</span></button>`; }).join("")}`); break;
    case "next": nextItem(); break;
    case "nexts": nextItem(); break;
    case "prevs": stopListen(); qi = Math.max(0, qi - 1); openItem(); break;
    case "voicetest": speak("Good morning! Did you sleep well last night?"); break;
    case "again": cur.phase = "work"; cur.ikinari = false; cur.quick = false; cur.mode = "practice"; goStep(1); break;
    case "allon": DATA.forEach(x => delete S.excl[x.id]); save(); render(); break;
    case "alloff": DATA.forEach(x => S.excl[x.id] = true); save(); render(); toast("すべて除外しました。出題する文がありません", () => { DATA.forEach(x => delete S.excl[x.id]); save(); render(); }); break;
    case "drill": { const ids = DATA.filter({all: x => true, fav: x => S.fav[x.id], weak: x => S.weak[x.id], mastered: x => isMastered(x.id)}[listFilter]).filter(x => !S.excl[x.id]); startSession(ids.map(x => ({id: x.id, mode: S.srs[x.id] ? "practice" : "new"}))); break; }
    case "listen-all": listenAll(); break;
    case "toggleautoplay": S.settings.autoplay = !S.settings.autoplay; save(); render(); break;
    case "togglesearch": S.settings.search = !S.settings.search; save(); render(); break;
    case "reset": confirmReset = true; render(); break;
    case "reset-no": confirmReset = false; render(); break;
    case "reset-yes": S = Object.assign(JSON.parse(JSON.stringify(DEF)), {custom: S.custom || []}); S.settings = Object.assign({}, DEF.settings); save(); rebuildData(); confirmReset = false; render(); toast("学習記録をリセットしました"); break;
  }
}
function sheetAction(name){
  if (name === "exclude"){ const id = cur.id; S.excl[id] = true; save(); closeSheet(); toast("この文を出題から外しました", () => { delete S.excl[id]; save(); if (view !== "study") render(); }); nextItem(); }
  if (name.startsWith("ch-")){ closeSheet(); stopListen(); startChapter(+name.slice(3)); return; }
  if (name === "restart"){ closeSheet(); cur.ikinari = false; goStep(1); }
}
function micStateText(){ return st.micState === "speech" ? "聞いています…話し終わったらもう一度押してください" : st.micState === "ready" ? "どうぞ、話してください" : "準備中…（まだ話さないでください）"; }
async function micToggle(d){
  if (listening){ const r = listening; listening = null; st.judging = true; render(); try { r.stop(); } catch(e){ try { r.abort(); } catch(_){} } return; }
  window.speechSynthesis && window.speechSynthesis.cancel();
  st.result = null; st.live = ""; st.err = ""; st.judging = false; st.micState = "starting";
  listening = listen(alts => { listening = null; st.judging = false; st.live = ""; st.result = bestScore(d, alts); if (st.result.pct >= S.settings.pass) onSpeechPass(); else onSpeechFail(); },
    err => { listening = null; st.judging = false; st.live = ""; st.err = micMessage(err) + (micLog.length ? "　［記録］" + micLog.join(" → ") : ""); if (micBlocked) toast("マイクが使えないため、自分で判定する方式に切り替えました"); render(); },
    live => { st.live = live; const el = document.getElementById("live"); if (el) el.textContent = "聞き取り中：" + live; },
    state => { if (st.micState === "speech" && state === "ready") return; st.micState = state; const el = document.getElementById("micstate"); if (el){ el.textContent = micStateText(); el.classList.add("go"); } });
  render();
}
function onSpeechPass(){
  S.prog[cur.id] = Math.max(S.prog[cur.id] || 0, cur.step); save();
  st.passed = true; render();
}
function speechNextHTML(){ return `<button class="btn primary wide" data-act="speechnext" style="margin-top:6px">${cur.step === 6 ? "結果を見る ›" : "次へ ›"}</button>`; }
function onSpeechFail(){
  if (cur.ikinari){ toast("ステップ1から練習しましょう"); cur.ikinari = false; goStep(1); return; }
  st.fails++; if (st.fails >= 3) S.weak[cur.id] = true; save(); render();
}
function placeTile(pi){
  if (st.state === "good") return;
  const d = byId[cur.id], answer = cur.step === 4 ? d.words : d.chunks;
  st.placed.push(pi); st.state = null;
  if (st.placed.length === answer.length){
    const built = st.placed.map(i => st.pool[i].t);
    if (built.join(" ") === answer.join(" ")){ st.state = "good"; render(); if (S.settings.autoplay) speak(d.en); passStep(); }
    else { st.fails++; st.state = "bad"; if (st.fails >= 3) S.weak[cur.id] = true; save(); render(); setTimeout(() => { if (st.state === "bad"){ st.placed = []; st.state = null; render(); } }, 800); }
  } else render();
}
function checkCloze(d){
  const ans = d.cloze_answers.flatMap(a => a.split(" "));
  st.checked = true;
  st.allGood = ans.every((a, i) => clean(st.vals[i] || "") === clean(a));
  if (st.allGood){ render(); if (S.settings.autoplay) speak(d.en); passStep(); }
  else { st.fails++; if (st.fails >= 3) S.weak[cur.id] = true; save(); render(); }
}
function hidePop(){ pop.hidden = true; }
function wordPop(el, d, wi){
  const w = d.word_info[wi], word = w.word.replace(/[^A-Za-z']/g, "");
  pop.innerHTML = `<div class="pw"><b lang="en">${esc(word)}</b><span class="ipa">${esc(w.ipa)}</span></div><div class="pm">${esc(w.meaning || "マイ例文の単語の意味は今後追加予定です")}</div>`;
  pop.hidden = false;
  const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight, vw = document.documentElement.clientWidth;
  let left = r.left + r.width / 2 - pw / 2; left = Math.max(12, Math.min(left, vw - pw - 12));
  let topY = r.top - ph - 12, below = false; if (topY < 8){ topY = r.bottom + 12; below = true; }
  pop.style.left = (left + window.scrollX) + "px"; pop.style.top = (topY + window.scrollY) + "px";
  pop.classList.toggle("below", below); pop.style.setProperty("--ax", (r.left + r.width / 2 - left) + "px");
}

function explainSheet(d){
  const ex = d.explanation; if (!ex){ toast("マイ例文の解説は今後追加予定です"); return; }
  openSheet(`<div class="lead">解説</div><p lang="en" style="font-family:var(--f-en);font-size:18px;margin:0 0 4px">${esc(d.en)}</p><p class="ja" style="margin:0">${esc(d.ja)}</p>
    <h3>重要単語</h3>${ex.key_words.map(k => `<div class="kv"><b lang="en">${esc(k.word)}</b><span style="flex:1">${esc(k.meaning)}</span><button class="say" data-say="${esc(k.word)}">▶</button></div>`).join("")}
    <h3>熟語・決まった言い方</h3>${ex.idioms.map(k => `<div class="kv"><b lang="en">${esc(k.phrase)}</b><span style="flex:1">${esc(k.meaning)}</span></div>`).join("")}
    <h3>文法・構文：${esc(d.pattern)}</h3><p style="margin:0">${esc(ex.grammar)}</p>`);
}
function listenAll(){
  if (!("speechSynthesis" in window)){ toast("この環境では音声を再生できません"); return; }
  const f = {all: x => true, fav: x => S.fav[x.id], weak: x => S.weak[x.id], mastered: x => isMastered(x.id)}[listFilter];
  const list = DATA.filter(f).filter(x => !S.excl[x.id]);
  speechSynthesis.cancel();
  list.forEach(x => {
    const j = new SpeechSynthesisUtterance(x.ja); j.lang = "ja-JP"; j.rate = 1.05;
    const u = new SpeechSynthesisUtterance(x.en); u.lang = "en-US"; if (voice) u.voice = voice; u.rate = S.settings.rate * 0.95;
    speechSynthesis.speak(j); speechSynthesis.speak(u);
  });
  toast(`${list.length}文を日本語→英語で再生しています`);
}
window.__ready = true;
render();
</script>
